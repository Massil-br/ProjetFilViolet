services:
  db:
    image: postgres:17
    container_name: filviolet_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-filviolet}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - filviolet_network

  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: filviolet_api

    restart: unless-stopped

    env_file:
      - ./backend/api/.env.docker

    ports:
      - "8081:8081"

    depends_on:
      - db

    networks:
      - filviolet_network

    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: filviolet
      DB_PORT: 5432
      DB_SSLMODE: disable

  game:
    build:
      context: .
      dockerfile: ./backend/game/Dockerfile
    container_name: filviolet_game

    restart: unless-stopped

    env_file:
      - ./backend/api/.env.docker

    ports:
      - "8082:8082"

    depends_on:
      - db

    networks:
      - filviolet_network

    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: filviolet
      DB_PORT: 5432
      DB_SSLMODE: disable

volumes:
  postgres_data:

networks:
  filviolet_network:
    driver: bridge
